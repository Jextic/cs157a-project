spring.application.name = web

# Database connection
spring.datasource.url = jdbc:mysql://localhost:3306/movie_booking_db

# Sets up a fake SQL user to reduce complications
spring.datasource.username = movie_user
spring.datasource.password = movie_pass
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

# Automatically runs SQL files
spring.sql.init.mode = always
spring.sql.init.schema-locations = \
  file:sql/movie_booking_test.sql
